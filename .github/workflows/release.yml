name: Release

# Runs on pushing an annotated tag vX.Y.Z; the release title and notes come from the tag message.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notmatch '^v\d') { $v = "v0.0.0-dev" }
          "tag=$v" >> $env:GITHUB_OUTPUT
          "num=$($v.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet run --project tests/AC.Core.Tests -c Release

      # App: one exe, no .NET install needed
      - name: Publish app
        run: >
          dotnet publish src/AC.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.num }} -o out/app

      - name: Pack
        shell: pwsh
        run: |
          Get-ChildItem out/app -Filter *.pdb -Recurse | Remove-Item
          $zip = "Hundo-${{ steps.ver.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path out/app/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      # Inno Setup pinned to the version the installer was checked with, not the one on the runner image.
      - name: Installer
        shell: pwsh
        run: |
          $is = "innosetup-6.7.3.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/$is" -OutFile $is
          if ((Get-FileHash $is).Hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") { throw "Unexpected $is" }
          Start-Process "./$is" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\is" -Wait
          & "$env:RUNNER_TEMP\is\ISCC.exe" /Q "/DAppVersion=${{ steps.ver.outputs.num }}" installer/Hundo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SETUP=out/Hundo-${{ steps.ver.outputs.tag }}-win-x64-setup.exe" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Hundo-win-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          # checkout leaves the tag as a commit ref without the message; fetch the annotated tag.
          git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "::error::Use an annotated tag with notes: git tag -a $tag --cleanup=whitespace -F notes.md"
            exit 1
          fi
          echo "title=$(git tag -l --format='%(contents:subject)' "$tag")" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents:body)' "$tag" > notes.md

      # A third-party action with write access to the release: pinned to a commit, not a movable tag.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
